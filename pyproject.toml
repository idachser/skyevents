[project]
name = "skyevents"
version = "0.1.0"
description = "Celestial events computation service with an HTTP API"
authors = [{ name = "igor" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "skyfield>=1.49,<2",
    "pydantic>=2.7,<3",
    # Query parameter models arrived in 0.115, but the `from` alias on
    # one is silently dropped until 0.124 (with pydantic 2.13), which
    # 422s every /v1/events request. Floor verified by running the API
    # tests against 0.115-0.125; 0.124 is the first that passes.
    "fastapi>=0.124,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # skyfield.searchlib and skyfield.keplerlib vs numpy 2.5, not ours to fix
    "ignore:Setting the dtype on a NumPy array has been deprecated:DeprecationWarning",
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skyevents"]

[tool.ruff]
exclude = [".venv"]
line-length = 80

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
