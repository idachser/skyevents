[project]
name = "skyevents"
version = "0.1.0"
description = "Celestial events computation service with an HTTP API"
authors = [{ name = "igor" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "skyfield>=1.49,<2",
    "pydantic>=2.7,<3",
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skyevents"]
